# Releases drive production. This workflow owns the whole path:
#
#   pull_request → main   quality ∥ e2e. Nothing is deployed, production is never touched.
#   release (published)   resolve-release ∥ quality ∥ e2e → migrate → deploy.
#                         migrate needs all three; a failed migration stops deploy.
#
# Release tag selects which app(s) deploy (CLI or GitHub UI — same trigger):
#
#   app-web/vX.Y.Z      → deploy app-web only
#   admin-web/vX.Y.Z    → deploy admin-web only
#   blog-web/vX.Y.Z     → deploy blog-web only (no migration — it owns no data)
#   vX.Y.Z              → deploy app-web + admin-web (shared / DB changes)
#
# `vX.Y.Z` deliberately does NOT include blog-web: that tag means "the two apps
# that share the database", and blog-web shares neither the database nor a
# release cadence with them. Its content lives in files, so it ships on its own.
#
# Pushing to `main` deliberately triggers NOTHING. Vercel's Git integration must
# stay disabled (see apps/*/vercel.json) or it would deploy on push behind this
# workflow's back; deployment happens only through the `deploy` job below, which
# builds the exact commit the release tag points at.
#
# On a PR these jobs report their status and nothing more — merging is not
# blocked. That is a deliberate choice, not an oversight: the signal is visible
# on the PR and a release cannot be cut from a red build anyway, because
# `migrate` needs both `quality` and `e2e`. To make it a hard gate instead, add
# both checks (`Quality (…)` and `E2E (Playwright)`) as required statuses on
# `main` in the repository settings — nothing in this file can do that.
name: CI

on:
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a PR push is fine; cancelling a half-finished release would
  # leave migrations applied and the deploy missing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ---------------------------------------------------------------------------
  # Parse the published release tag into a deploy matrix. Invalid tags fail here
  # so migrate/deploy never run. Runs in parallel with quality on release events.
  # ---------------------------------------------------------------------------
  resolve-release:
    name: Resolve release target
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # Every job here carries an explicit budget. GitHub's default is 360
    # minutes, so anything that hangs rather than fails — an apt lock, a stalled
    # mirror, a webServer that never answers — sits there for six hours holding
    # the PR open and burning runner time. These numbers are roughly double the
    # observed run times: generous enough never to cut a healthy build, tight
    # enough that a wedge shows up as a red X while you are still looking.
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
      # 'false' for a blog-web-only release: it reads no database, so there is
      # nothing to migrate and no reason to open the production environment.
      needs_migrate: ${{ steps.parse.outputs.needs_migrate }}
    steps:
      - name: Parse tag → deploy matrix
        id: parse
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          app_web='{"app":"app-web","project_id_secret":"VERCEL_PROJECT_ID_APP_WEB"}'
          admin_web='{"app":"admin-web","project_id_secret":"VERCEL_PROJECT_ID_ADMIN_WEB"}'
          blog_web='{"app":"blog-web","project_id_secret":"VERCEL_PROJECT_ID_BLOG_WEB"}'
          needs_migrate=true

          if [[ "$TAG" =~ ^app-web/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            matrix="[$app_web]"
            target=app-web
          elif [[ "$TAG" =~ ^admin-web/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            matrix="[$admin_web]"
            target=admin-web
          elif [[ "$TAG" =~ ^blog-web/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            matrix="[$blog_web]"
            target=blog-web
            needs_migrate=false
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            matrix="[$app_web,$admin_web]"
            target=both
          else
            echo "❌ Unsupported release tag: $TAG"
            echo "Expected: app-web/vX.Y.Z | admin-web/vX.Y.Z | blog-web/vX.Y.Z | vX.Y.Z"
            exit 1
          fi

          echo "needs_migrate=$needs_migrate" >> "$GITHUB_OUTPUT"

          {
            echo "matrix<<EOF"
            echo "$matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "📦 tag \`$TAG\` → deploy **$target**" >> "$GITHUB_STEP_SUMMARY"
          echo "matrix=$matrix" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # AC-13 — quality gate. Runs on PRs and again on release. Needs no secrets:
  # the throwaway Postgres service below stands in for the production database.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (lint / format / typecheck / unit / schema owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Throwaway PostgreSQL: lets us prove the committed migrations actually
    # apply and match schema.prisma, without ever touching Neon.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Schema-ownership hard constraint (AC-13)
        run: pnpm check:schema-owner

      - name: Prisma validate (packages/db)
        run: pnpm --filter @app/db run validate

      - name: Apply committed migrations to throwaway DB
        working-directory: packages/db
        run: pnpm exec prisma migrate deploy

      # `migrate diff --from-migrations` replays the migration folder into a
      # shadow database. Prisma creates and drops *schemas* inside it, but it
      # never creates the database itself — so it has to exist first, otherwise
      # the step dies with P1003.
      - name: Create shadow database
        run: PGPASSWORD=ci psql -v ON_ERROR_STOP=1 -h localhost -U ci -d ci -c 'CREATE DATABASE ci_shadow'

      - name: Migration drift check (migrations must equal schema.prisma)
        working-directory: packages/db
        run: |
          set -uo pipefail
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code && status=0 || status=$?
          # --exit-code: 0 = identical, 2 = drift, anything else = the command
          # itself failed. Collapsing them all into "out of sync" hides real
          # errors (a bad connection string reads as a schema problem).
          case "$status" in
            0) echo "✅ migrations in sync" ;;
            2) echo "❌ migrations are out of sync with schema.prisma — run 'pnpm db:migrate' and commit the result"; exit 1 ;;
            *) echo "❌ prisma migrate diff failed to run (exit $status)"; exit "$status" ;;
          esac

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Deliberately inside `quality` rather than a job of its own: the suite is
      # pure functions, needs no service and no secret, and finishes in about a
      # second — a separate job's queue time would cost more than the tests. It
      # sits before `build` because it fails faster.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # End-to-end gate. Boots the real stack — production builds of both apps, a
  # throwaway PostgreSQL, and the same Upstash-REST shim used in local dev — and
  # drives it over HTTP. Nothing is mocked and nothing is stubbed, so this is the
  # only job that can prove the claims which span two applications: the disabled-
  # user kill switch, RBAC agreeing across all three layers, write+audit
  # atomicity, and the two sessions being un-replayable against each other.
  #
  # Needs no secrets, exactly like `quality`, and runs in parallel with it.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # The longest job, and the one that has actually wedged: a full run is
    # ~6-12 minutes, so 30 leaves room for a slow runner without leaving a
    # hang to run its six hours.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
      # The apps talk Upstash REST, never raw Redis (packages/shared/src/redis.ts),
      # so CI needs the same shim docker-compose runs. Service containers share a
      # network and resolve each other by label, hence `redis://redis:6379`.
      redis-http:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci_e2e_token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports: ['8079:80']
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_e2e?schema=public
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: ci_e2e_token
      # MUST differ — `session-isolation.spec.ts` asserts that a token minted by
      # one app cannot be decrypted by the other, and a single shared secret here
      # would turn a real vulnerability into a green build.
      AUTH_SECRET_APP: ci-e2e-app-secret-value-at-least-32-chars
      AUTH_SECRET_ADMIN: ci-e2e-admin-secret-value-at-least-32-chars
      AUTH_TRUST_HOST: 'true'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3001
      SEED_SUPER_ADMIN_EMAIL: super@ci.local
      SEED_SUPER_ADMIN_PASSWORD: CiE2eSuper!2345
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The shim has no health check of its own, and the first sign-in hits the
      # rate limiter — i.e. Redis — so a race here would read as an auth failure.
      #
      # Probe it the way @upstash/redis does: POST the command array to `/`. The
      # shim has no `/ping` route — `GET /ping` answers 404 with
      # {"error":"SRH: Endpoint not found..."}, which `curl -sf` cannot tell apart
      # from a shim that never started. Matching PONG also proves the token is
      # right and the command reached Redis, not merely that a port is open.
      - name: Wait for the Upstash REST shim
        run: |
          for _ in $(seq 1 30); do
            body=$(curl -sS -X POST \
              -H 'Authorization: Bearer ci_e2e_token' \
              -H 'Content-Type: application/json' \
              -d '["PING"]' http://localhost:8079 2>&1 || true)
            case "$body" in
              *PONG*) echo "✅ redis-http ready: $body"; exit 0 ;;
            esac
            sleep 1
          done
          echo "❌ redis-http never became ready. Last response: ${body:-<none>}"
          docker ps --format '{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
          exit 1

      - name: Prisma client + schema
        run: |
          pnpm db:generate
          pnpm --filter @app/db exec prisma migrate deploy

      - name: Seed the super admin
        run: pnpm db:seed

      # Separate from `db:seed` on purpose — that one only creates the super
      # admin. Without the daily-speaking prompts, `pickPromptId` throws on an
      # empty ring and GET /api/speaking/today answers 500, which every
      # speaking spec reads as a broken app. Idempotent, so re-running is safe.
      - name: Seed the daily-speaking prompts
        run: pnpm speaking:seed

      # Keyed on the lockfile: the browser build is pinned by the Playwright
      # version, so it only needs re-downloading when that moves.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # No `--with-deps`. That flag shells out to `sudo apt-get`, and apt is the
      # only thing in this job that has ever failed: the runner's default mirror
      # (azure.archive.ubuntu.com) stopped answering, apt fell back to the public
      # archive, and `apt-get update` sat there — fifty minutes on one run, six
      # on the next.
      #
      # Nor can it simply be bounded. `timeout` signals its direct child, which
      # here is pnpm; the actual `apt-get` is a root-owned grandchild under sudo
      # and survives, holding /var/lib/apt/lists/lock. The retry that followed
      # then died in seven seconds on `Could not get lock ... held by process
      # 3700 (apt-get)` — its own orphan. Killing apt on a clock converts a hang
      # into a guaranteed failure, so the answer is not to run it at all.
      #
      # The runner image ships Chrome and Edge, so Chromium's shared libraries
      # are already installed; this only has to unpack the pinned build, which
      # is cache-backed and took 20s and 69s on the runs before apt broke.
      - name: Install Chromium
        run: pnpm --filter @app/e2e exec playwright install chromium

      # Two seconds, and it is what makes dropping `--with-deps` safe to reason
      # about: if the image ever stops carrying a library Chromium needs, this
      # fails immediately and names it, instead of surfacing as a browser that
      # will not start somewhere in the middle of a 67-test suite.
      - name: Verify Chromium launches
        run: |
          pnpm --filter @app/e2e exec node -e "
            const { chromium } = require('@playwright/test')
            chromium
              .launch()
              .then(async (b) => {
                console.log('✅ chromium ' + b.version())
                await b.close()
              })
              .catch((e) => {
                console.error('❌ chromium will not launch: ' + e.message)
                process.exit(1)
              })
          "

      # Playwright starts `next start` for both apps, so they must be built first.
      - name: Build
        run: pnpm build

      - name: Run the suite
        run: pnpm e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Release: apply committed migrations to the production database, BEFORE the
  # new code is deployed.
  #
  # Migrations run from packages/db and nowhere else (SPEC §1.2) — never from a
  # Vercel build, which is why this lives here rather than in a build command.
  # `needs: quality` means a red build never migrates production; `deploy` in
  # turn needs this job, so a failed migration leaves the old code serving.
  #
  # The ordering is migrate-then-deploy, so a migration must be readable by the
  # PREVIOUS release for the window between the two jobs. Expand/contract still
  # applies: add columns in one release, drop them in a later one.
  # ---------------------------------------------------------------------------
  migrate:
    name: Prisma migrate deploy (packages/db)
    # Skipped entirely for a blog-web-only release — that app reads no database,
    # so there is no reason to open the production environment for it.
    if: github.event_name == 'release' && needs.resolve-release.outputs.needs_migrate == 'true'
    # resolve-release must succeed first so a bad tag never touches production DB.
    needs: [quality, e2e, resolve-release]
    runs-on: ubuntu-latest
    environment: production
    # Excludes the wait for a required reviewer: the clock starts once the
    # environment gate opens, not while the approval is pending.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate deploy
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # Repository *variable*, not a secret — a schema name is not sensitive,
          # and `vars.` renders to an empty string when unset, which is a no-op.
          # Must match DATABASE_SCHEMA in both Vercel projects, or this job would
          # migrate a schema the apps never read.
          DATABASE_SCHEMA: ${{ vars.DATABASE_SCHEMA }}
        run: pnpm exec prisma migrate deploy

  # ---------------------------------------------------------------------------
  # Release: promote the tagged commit to production on Vercel.
  #
  # This does NOT build locally. `vercel deploy` uploads the source and Vercel
  # builds it with the project's own Root Directory and Build Command
  # (`cd ../.. && pnpm turbo run build --filter=<app>`) — the configuration that
  # is already known to work. Building here with `vercel build --prebuilt` would
  # mean reproducing the monorepo build twice, in two places, forever.
  #
  # Deployments are per-project. The matrix comes from resolve-release so a
  # single-app tag only uploads that Vercel project. When both run, fail-fast
  # is off: if app-web fails there is no reason to abort a half-finished
  # admin-web.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy ${{ matrix.app }} (production)
    # `always()` is what lets a blog-web release deploy while `migrate` is
    # SKIPPED — a skipped dependency would otherwise skip this job too. The
    # explicit result checks put the gate back: a failed or cancelled migration
    # still stops the deploy, exactly as before.
    if: |
      always() && github.event_name == 'release' &&
      needs.resolve-release.result == 'success' &&
      needs.quality.result == 'success' && needs.e2e.result == 'success' &&
      needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled'
    needs: [migrate, resolve-release, quality, e2e]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-release.outputs.matrix) }}
    env:
      # Both are read by the Vercel CLI directly; setting them is what lets it
      # skip `vercel link` and work in a bare checkout.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # For a `release` event this checks out the commit the tag points at, not
      # whatever `main` has drifted to since — that is the whole point of
      # releasing rather than pushing.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs from the REPO ROOT on purpose: that uploads the same file tree the
      # Git integration used to, so the project's Root Directory (`apps/<app>`)
      # and "Include source files outside of the Root Directory" resolve exactly
      # as before. Deploying from inside apps/<app> would upload a tree in which
      # that Root Directory no longer exists.
      - name: Deploy to Vercel
        id: deploy
        run: |
          set -euo pipefail
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "🚀 ${{ matrix.app }} → $url" >> "$GITHUB_STEP_SUMMARY"
