# Releases drive production. This workflow owns the whole path:
#
#   pull_request → main   quality only. Nothing is deployed, production is never touched.
#   release (published)   resolve-release ∥ quality → migrate → deploy.
#                         migrate needs both; a failed migration stops deploy.
#
# Release tag selects which app(s) deploy (CLI or GitHub UI — same trigger):
#
#   app-web/vX.Y.Z      → deploy app-web only
#   admin-web/vX.Y.Z    → deploy admin-web only
#   vX.Y.Z              → deploy both (shared / DB changes)
#
# Pushing to `main` deliberately triggers NOTHING. Vercel's Git integration must
# stay disabled (see apps/*/vercel.json) or it would deploy on push behind this
# workflow's back; deployment happens only through the `deploy` job below, which
# builds the exact commit the release tag points at.
#
# Protect `main` with the `quality` check as a required status so a red build
# can never be tagged in the first place.
name: CI

on:
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a PR push is fine; cancelling a half-finished release would
  # leave migrations applied and the deploy missing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ---------------------------------------------------------------------------
  # Parse the published release tag into a deploy matrix. Invalid tags fail here
  # so migrate/deploy never run. Runs in parallel with quality on release events.
  # ---------------------------------------------------------------------------
  resolve-release:
    name: Resolve release target
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - name: Parse tag → deploy matrix
        id: parse
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          app_web='{"app":"app-web","project_id_secret":"VERCEL_PROJECT_ID_APP_WEB"}'
          admin_web='{"app":"admin-web","project_id_secret":"VERCEL_PROJECT_ID_ADMIN_WEB"}'

          if [[ "$TAG" =~ ^app-web/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            matrix="[$app_web]"
            target=app-web
          elif [[ "$TAG" =~ ^admin-web/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            matrix="[$admin_web]"
            target=admin-web
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            matrix="[$app_web,$admin_web]"
            target=both
          else
            echo "❌ Unsupported release tag: $TAG"
            echo "Expected: app-web/vX.Y.Z | admin-web/vX.Y.Z | vX.Y.Z"
            exit 1
          fi

          {
            echo "matrix<<EOF"
            echo "$matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "📦 tag \`$TAG\` → deploy **$target**" >> "$GITHUB_STEP_SUMMARY"
          echo "matrix=$matrix" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # AC-13 — quality gate. Runs on PRs and again on release. Needs no secrets:
  # the throwaway Postgres service below stands in for the production database.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (lint / format / typecheck / schema owner)
    runs-on: ubuntu-latest
    # Throwaway PostgreSQL: lets us prove the committed migrations actually
    # apply and match schema.prisma, without ever touching Neon.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Schema-ownership hard constraint (AC-13)
        run: pnpm check:schema-owner

      - name: Prisma validate (packages/db)
        run: pnpm --filter @app/db run validate

      - name: Apply committed migrations to throwaway DB
        working-directory: packages/db
        run: pnpm exec prisma migrate deploy

      # `migrate diff --from-migrations` replays the migration folder into a
      # shadow database. Prisma creates and drops *schemas* inside it, but it
      # never creates the database itself — so it has to exist first, otherwise
      # the step dies with P1003.
      - name: Create shadow database
        run: PGPASSWORD=ci psql -v ON_ERROR_STOP=1 -h localhost -U ci -d ci -c 'CREATE DATABASE ci_shadow'

      - name: Migration drift check (migrations must equal schema.prisma)
        working-directory: packages/db
        run: |
          set -uo pipefail
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code && status=0 || status=$?
          # --exit-code: 0 = identical, 2 = drift, anything else = the command
          # itself failed. Collapsing them all into "out of sync" hides real
          # errors (a bad connection string reads as a schema problem).
          case "$status" in
            0) echo "✅ migrations in sync" ;;
            2) echo "❌ migrations are out of sync with schema.prisma — run 'pnpm db:migrate' and commit the result"; exit 1 ;;
            *) echo "❌ prisma migrate diff failed to run (exit $status)"; exit "$status" ;;
          esac

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Release: apply committed migrations to the production database, BEFORE the
  # new code is deployed.
  #
  # Migrations run from packages/db and nowhere else (SPEC §1.2) — never from a
  # Vercel build, which is why this lives here rather than in a build command.
  # `needs: quality` means a red build never migrates production; `deploy` in
  # turn needs this job, so a failed migration leaves the old code serving.
  #
  # The ordering is migrate-then-deploy, so a migration must be readable by the
  # PREVIOUS release for the window between the two jobs. Expand/contract still
  # applies: add columns in one release, drop them in a later one.
  # ---------------------------------------------------------------------------
  migrate:
    name: Prisma migrate deploy (packages/db)
    if: github.event_name == 'release'
    # resolve-release must succeed first so a bad tag never touches production DB.
    needs: [quality, resolve-release]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate deploy
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # Repository *variable*, not a secret — a schema name is not sensitive,
          # and `vars.` renders to an empty string when unset, which is a no-op.
          # Must match DATABASE_SCHEMA in both Vercel projects, or this job would
          # migrate a schema the apps never read.
          DATABASE_SCHEMA: ${{ vars.DATABASE_SCHEMA }}
        run: pnpm exec prisma migrate deploy

  # ---------------------------------------------------------------------------
  # Release: promote the tagged commit to production on Vercel.
  #
  # This does NOT build locally. `vercel deploy` uploads the source and Vercel
  # builds it with the project's own Root Directory and Build Command
  # (`cd ../.. && pnpm turbo run build --filter=<app>`) — the configuration that
  # is already known to work. Building here with `vercel build --prebuilt` would
  # mean reproducing the monorepo build twice, in two places, forever.
  #
  # Deployments are per-project. The matrix comes from resolve-release so a
  # single-app tag only uploads that Vercel project. When both run, fail-fast
  # is off: if app-web fails there is no reason to abort a half-finished
  # admin-web.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy ${{ matrix.app }} (production)
    if: github.event_name == 'release'
    needs: [migrate, resolve-release]
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-release.outputs.matrix) }}
    env:
      # Both are read by the Vercel CLI directly; setting them is what lets it
      # skip `vercel link` and work in a bare checkout.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # For a `release` event this checks out the commit the tag points at, not
      # whatever `main` has drifted to since — that is the whole point of
      # releasing rather than pushing.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Runs from the REPO ROOT on purpose: that uploads the same file tree the
      # Git integration used to, so the project's Root Directory (`apps/<app>`)
      # and "Include source files outside of the Root Directory" resolve exactly
      # as before. Deploying from inside apps/<app> would upload a tree in which
      # that Root Directory no longer exists.
      - name: Deploy to Vercel
        id: deploy
        run: |
          set -euo pipefail
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "🚀 ${{ matrix.app }} → $url" >> "$GITHUB_STEP_SUMMARY"
