# Deployment is NOT done here — Vercel's Git integration builds and deploys both
# projects on its own. This workflow owns the two things Vercel does not do:
# the quality gate, and applying migrations to the production database.
#
# Consequence to be aware of: Vercel starts building the moment you push, so the
# `migrate` job below races the deploy rather than gating it. Keep migrations
# backward compatible, or run `pnpm db:deploy` by hand before merging anything
# destructive. Protect `main` with the `quality` check as a required status so
# broken code never reaches Vercel in the first place.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ---------------------------------------------------------------------------
  # AC-13 — quality gate. Runs on both PR and push to main. Needs no secrets:
  # the throwaway Postgres service below stands in for the production database.
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (lint / format / typecheck / schema owner)
    runs-on: ubuntu-latest
    # Throwaway PostgreSQL: lets us prove the committed migrations actually
    # apply and match schema.prisma, without ever touching Neon.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Schema-ownership hard constraint (AC-13)
        run: pnpm check:schema-owner

      - name: Prisma validate (packages/db)
        run: pnpm --filter @app/db run validate

      - name: Apply committed migrations to throwaway DB
        working-directory: packages/db
        run: pnpm exec prisma migrate deploy

      # `migrate diff --from-migrations` replays the migration folder into a
      # shadow database. Prisma creates and drops *schemas* inside it, but it
      # never creates the database itself — so it has to exist first, otherwise
      # the step dies with P1003.
      - name: Create shadow database
        run: PGPASSWORD=ci psql -v ON_ERROR_STOP=1 -h localhost -U ci -d ci -c 'CREATE DATABASE ci_shadow'

      - name: Migration drift check (migrations must equal schema.prisma)
        working-directory: packages/db
        run: |
          set -uo pipefail
          pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code && status=0 || status=$?
          # --exit-code: 0 = identical, 2 = drift, anything else = the command
          # itself failed. Collapsing them all into "out of sync" hides real
          # errors (a bad connection string reads as a schema problem).
          case "$status" in
            0) echo "✅ migrations in sync" ;;
            2) echo "❌ migrations are out of sync with schema.prisma — run 'pnpm db:migrate' and commit the result"; exit 1 ;;
            *) echo "❌ prisma migrate diff failed to run (exit $status)"; exit "$status" ;;
          esac

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # Push to main: apply committed migrations to the production database.
  #
  # Migrations run from packages/db and nowhere else (SPEC §1.2) — never from a
  # Vercel build, which is why this lives here rather than in a build command.
  # `needs: quality` means a red build never migrates production.
  # ---------------------------------------------------------------------------
  migrate:
    name: Prisma migrate deploy (packages/db)
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate deploy
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          # Repository *variable*, not a secret — a schema name is not sensitive,
          # and `vars.` renders to an empty string when unset, which is a no-op.
          # Must match DATABASE_SCHEMA in both Vercel projects, or this job would
          # migrate a schema the apps never read.
          DATABASE_SCHEMA: ${{ vars.DATABASE_SCHEMA }}
        run: pnpm exec prisma migrate deploy
