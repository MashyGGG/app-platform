# Local-only stand-ins for Neon (PostgreSQL) and Upstash (Redis REST).
# Production uses Neon + Upstash; this file exists purely so the whole flow
# (migrate / seed / rate limit / dashboard cache) can be verified offline.
#
#   docker compose up -d
#   pnpm db:migrate && pnpm db:seed
services:
  postgres:
    image: postgres:16-alpine
    container_name: app-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app_platform']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: app-platform-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    # Deliberately NOT published to the host: the app talks to Redis through the
    # Upstash-REST shim below, which keeps local dev identical to production.
    expose:
      - '6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # Speaks the Upstash REST protocol on top of the plain Redis above, so the
  # app code can use @upstash/redis unchanged in local dev.
  redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: app-platform-redis-http
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: local_dev_token
      SRH_CONNECTION_STRING: 'redis://redis:6379'
    ports:
      - '8079:80'

volumes:
  postgres-data:
  redis-data:
